name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          unzip -q JARVIS-2.5.0-RU-voice-source.zip
          test -d jarvis-2.5.0/jarvis-studio-gui
          echo "Project extracted successfully"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jarvis-2.5.0/jarvis-studio-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: jarvis-2.5.0/jarvis-studio-gui
        run: npm ci

      - name: Build Android APK
        working-directory: jarvis-2.5.0/jarvis-studio-gui
        run: npm run android:build -- --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-RU-APK
          path: jarvis-2.5.0/jarvis-studio-gui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
